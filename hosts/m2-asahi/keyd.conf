[ids]
*

[main]
capslock = overload(hyper, capslock)
leftmeta = layer(command)
rightmeta = layer(command)
leftalt = layer(option)
rightalt = layer(option)

# Command behaves like Ctrl in applications, with desktop-level exceptions.
[command:C]
c = C-insert
v = S-insert
x = S-delete
q = M-q
space = M-space
enter = M-enter
tab = swapm(app-switcher, A-tab)
1 = M-1
2 = M-2
3 = M-3
4 = M-4
5 = M-5
6 = M-6
7 = M-7
8 = M-8
9 = M-9
0 = M-0
left = home
right = end
up = C-home
down = C-end

# Option selects Macintosh symbols; navigation follows macOS conventions.
[option:G]
left = C-left
right = C-right
up = C-up
down = C-down
backspace = C-backspace
delete = C-delete

# Caps Lock emits Hyper while held and remains Caps Lock when tapped.
[hyper:C-A-M]

[command+shift]
c = C-S-c
v = M-S-v
x = C-S-x

# Keep Alt held while Command is held so Noctalia can own the switcher lifecycle.
[app-switcher:A]
tab = A-tab
